# docker compose up -d   →   http://localhost:8080
# The first visit asks you to create your account, then adds your media folders and (optionally) a TMDB token.
# Anything you mount under /media is visible to Settings → Library → Add a folder.
services:
  mediaserver:
    build: .                              # builds the image from this repository
    # image: ghcr.io/<your-account>/marquee:latest   # or pull one your own CI published (see .github/workflows/ci.yml)
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      Library__Root: /media
      Database__Path: /data/mediaserver.db
      Images__CacheDir: /data/images
      # Auth__SetupCode: choose-a-code   # require this code on first run, so nobody else can claim a freshly deployed server
      # Auth__TrustProxy: "true"          # behind a reverse proxy: throttle logins per visitor (X-Forwarded-For)
      # Hls__Encoder: nvenc        # hardware encoding on NVIDIA (needs the NVIDIA container runtime)
    volumes:
      - /path/to/your/media:/media:ro   # movies and tv shows, e.g. /media/Movies and /media/TV
      - mediaserver-data:/data          # database, artwork cache, settings
volumes:
  mediaserver-data:
