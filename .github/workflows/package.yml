name: package

# Self-contained downloads for Windows, Linux and macOS.
# To publish a release: Actions → package → Run workflow, and fill in the version. The builds run, then a release (with its tag, made for you)
# appears under Releases with every download attached. Creating a release by hand in the GitHub UI (v* tag) also works: the files are attached to it.
# Run it without a version to just build the files (they are kept as workflow artifacts).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 0.0.3 (leave empty to only build)"
        required: false
      label:
        description: "Stage shown after the version (ALPHA, BETA…); empty for a normal release"
        default: "ALPHA"
        required: false
      notes:
        description: "Release notes (leave empty to list the changes since the last release)"
        required: false

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   rid: win-x64,     name: Marquee-windows-x64 }
          - { os: ubuntu-latest,    rid: linux-x64,   name: Marquee-linux-x64,   ffmpeg: linux64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64, name: Marquee-linux-arm64, ffmpeg: linuxarm64 }
          - { os: macos-latest,     rid: osx-arm64,   name: Marquee-macos-arm64 }
          - { os: macos-15-intel,   rid: osx-x64,     name: Marquee-macos-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish (self-contained)
        shell: bash
        run: |
          dotnet publish src/MediaServer.Api/MediaServer.Api.csproj -c Release -r ${{ matrix.rid }} --self-contained -o out/Marquee -p:DebugType=None -p:DebugSymbols=false
          if [ "$RUNNER_OS" = Windows ]; then cp packaging/windows/* out/Marquee/; else cp packaging/unix/* out/Marquee/; chmod +x out/Marquee/MediaServer.Api out/Marquee/*.sh out/Marquee/*.command; fi
      - name: Bundle ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-extract
          $bin = Get-ChildItem ffmpeg-extract -Recurse -Filter ffmpeg.exe | Select-Object -First 1 | ForEach-Object { $_.DirectoryName }
          New-Item -ItemType Directory out/Marquee/ffmpeg | Out-Null
          Copy-Item "$bin/ffmpeg.exe", "$bin/ffprobe.exe" out/Marquee/ffmpeg/
      - name: Bundle ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-${{ matrix.ffmpeg }}-gpl.tar.xz" -o ffmpeg.tar.xz
          mkdir ffmpeg-extract && tar -xJf ffmpeg.tar.xz -C ffmpeg-extract
          mkdir out/Marquee/ffmpeg && cp ffmpeg-extract/*/bin/ffmpeg ffmpeg-extract/*/bin/ffprobe out/Marquee/ffmpeg/
      - name: Install ffmpeg for the smoke test (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Smoke test
        shell: bash
        run: |
          export ASPNETCORE_URLS=http://127.0.0.1:8080 Database__Path="$PWD/smoke/db.sqlite"
          EXE=out/Marquee/MediaServer.Api; [ "$RUNNER_OS" = Windows ] && EXE=out/Marquee/MediaServer.Api.exe
          "$EXE" & PID=$!
          ok=0; for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/health >/dev/null && { ok=1; break; }; sleep 1; done
          kill $PID 2>/dev/null || true
          [ $ok = 1 ] || { echo "server did not answer /health"; exit 1; }
      - name: Archive
        shell: bash
        run: |
          cd out
          if [ "$RUNNER_OS" = Linux ]; then tar -czf "../${{ matrix.name }}.tar.gz" Marquee; echo "ASSET=${{ matrix.name }}.tar.gz" >> "$GITHUB_ENV"
          elif [ "$RUNNER_OS" = macOS ]; then zip -qry "../${{ matrix.name }}.zip" Marquee; echo "ASSET=${{ matrix.name }}.zip" >> "$GITHUB_ENV"
          else 7z a -tzip -bso0 "../${{ matrix.name }}.zip" Marquee; echo "ASSET=${{ matrix.name }}.zip" >> "$GITHUB_ENV"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

  release:
    needs: package
    if: github.event_name == 'push' || inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Marquee-*
          merge-multiple: true
          path: dist
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          LABEL: ${{ inputs.label }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = push ]; then
            TAG="${GITHUB_REF_NAME}"
            gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes --repo "$GITHUB_REPOSITORY"
          else
            [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]] || { echo "Version must look like 0.0.3"; exit 1; }
            TAG="v${VERSION}"; TITLE="$VERSION"; ARGS=()
            if [ -n "$LABEL" ]; then TAG="${TAG}-$(echo "$LABEL" | tr 'A-Z ' 'a-z-')"; TITLE="$VERSION $LABEL"; ARGS+=(--prerelease); fi
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "Release $TAG already exists"; exit 1; fi
            if [ -n "$NOTES" ]; then ARGS+=(--notes "$NOTES"); else ARGS+=(--generate-notes); fi
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" "${ARGS[@]}"
          fi
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          echo "Released $TAG" >> "$GITHUB_STEP_SUMMARY"
