name: windows

on:
  push:
    tags: ["m*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish (self-contained, win-x64)
        shell: pwsh
        run: |
          dotnet publish src/MediaServer.Api/MediaServer.Api.csproj -c Release -r win-x64 --self-contained -o out/Marquee /p:DebugType=None /p:DebugSymbols=false
          Copy-Item packaging/windows/* out/Marquee/
      - name: Bundle ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-extract
          $bin = Get-ChildItem ffmpeg-extract -Recurse -Filter ffmpeg.exe | Select-Object -First 1 | ForEach-Object { $_.DirectoryName }
          New-Item -ItemType Directory out/Marquee/ffmpeg | Out-Null
          Copy-Item "$bin/ffmpeg.exe", "$bin/ffprobe.exe" out/Marquee/ffmpeg/
      - name: Smoke test
        shell: pwsh
        run: |
          $env:ASPNETCORE_URLS = "http://127.0.0.1:8080"
          $env:Database__Path = "$PWD/smoke/db.sqlite"
          $p = Start-Process out/Marquee/MediaServer.Api.exe -PassThru
          try {
            $ok = $false
            foreach ($i in 1..30) { try { if ((Invoke-WebRequest http://127.0.0.1:8080/health -UseBasicParsing).StatusCode -eq 200) { $ok = $true; break } } catch { Start-Sleep 1 } }
            if (-not $ok) { throw "server did not answer /health" }
          } finally { Stop-Process $p -Force }
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path out/Marquee -DestinationPath Marquee-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Marquee-windows-x64
          path: Marquee-windows-x64.zip
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ${{ github.ref_name }} 2>$null; if ($LASTEXITCODE -ne 0) { gh release create ${{ github.ref_name }} --title ${{ github.ref_name }} --generate-notes }
          gh release upload ${{ github.ref_name }} Marquee-windows-x64.zip --clobber
