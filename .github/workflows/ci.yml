name: ci

on:
  push:
    branches: [main]
    tags: ["m*"]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  # ghcr.io/<owner>/<name>; set the repository variable IMAGE_NAME to change the name (default: mediaserver)
  IMAGE: ghcr.io/${{ github.repository_owner }}/${{ vars.IMAGE_NAME || 'mediaserver' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Real ffmpeg so the end-to-end HLS/ffprobe tests actually run instead of returning early.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # The web client is plain JavaScript with no build step; catch syntax errors before they reach a browser.
      - run: node --check src/MediaServer.Api/wwwroot/app.js
      - run: node --check src/MediaServer.Api/wwwroot/live.js
      - run: node --check src/MediaServer.Api/wwwroot/settings.js
      - run: node --check src/MediaServer.Api/wwwroot/auth.js
      # --blame-hang: if a test ever hangs, name it and dump instead of silently running until the job times out.
      - run: dotnet test --configuration Release --blame-hang --blame-hang-timeout 5m

  image:
    needs: test
    runs-on: ubuntu-latest # x86_64, matching the cluster
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
      - name: Build (amd64) and load for smoke testing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: mediaserver:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: scripts/smoke-test.sh mediaserver:ci
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
