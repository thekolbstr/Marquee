name: ci

on:
  push:
    branches: [main]
    tags: ["m*", "v*"]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  # ghcr.io/<owner>/<name>; set the repository variable IMAGE_NAME to change the name (default: mediaserver)
  IMAGE: ghcr.io/${{ github.repository_owner }}/${{ vars.IMAGE_NAME || 'mediaserver' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Real ffmpeg so the end-to-end HLS/ffprobe tests actually run instead of returning early.
      - name: Install ffmpeg
        run: |
          # The runner's package mirror occasionally stalls; bound every attempt and retry instead of hanging the job.
          for i in 1 2 3; do
            timeout 240 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update \
              && timeout 300 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y --no-install-recommends ffmpeg && break
            echo "apt attempt $i failed"; sleep 5
          done
          ffmpeg -version | head -1
      # The web client is plain JavaScript with no build step; catch syntax errors before they reach a browser.
      - run: node --check src/MediaServer.Api/wwwroot/app.js
      - run: node --check src/MediaServer.Api/wwwroot/live.js
      - run: node --check src/MediaServer.Api/wwwroot/settings.js
      - run: node --check src/MediaServer.Api/wwwroot/auth.js
      - run: node --check src/MediaServer.Api/wwwroot/extras.js
      - run: node --check src/MediaServer.Api/wwwroot/sw.js
      - run: node --check src/MediaServer.Api/wwwroot/shared.js
      - run: node --check src/MediaServer.Api/wwwroot/player.js
      # Unit tests for the page's pure logic (formatting, language matching, the stats table, preview maths).
      - run: node --test web-tests/*.test.js
      # Catches undefined names and similar slips in the web client before a browser does (the scripts share globals, so this matters).
      - run: npx --yes eslint@9 -c eslint.config.mjs 'src/MediaServer.Api/wwwroot/*.js' 'web-tests/*.js'
      # --blame-hang: if a test ever hangs, name it and dump instead of silently running until the job times out.
      - run: dotnet test --configuration Release --blame-hang --blame-hang-timeout 5m

  image:
    needs: test
    runs-on: ubuntu-latest # x86_64, matching the cluster
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Install ffmpeg
        run: |
          # The runner's package mirror occasionally stalls; bound every attempt and retry instead of hanging the job.
          for i in 1 2 3; do
            timeout 240 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update \
              && timeout 300 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y --no-install-recommends ffmpeg && break
            echo "apt attempt $i failed"; sleep 5
          done
          ffmpeg -version | head -1
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
      - name: Build (amd64) and load for smoke testing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: mediaserver:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: scripts/smoke-test.sh mediaserver:ci
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # Optional: point a GitOps repo at the image that was just pushed, so the cluster picks up every change on main.
  # Does nothing unless the repository variable GITOPS_REPO (owner/name) and the secret GITOPS_TOKEN (write access to it) are set.
  # Variables: GITOPS_REPO, GITOPS_FILE (manifest containing the image line, e.g. mediaserver/resources.yaml), IMAGE_NAME.
  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GITOPS_REPO != '' && vars.GITOPS_FILE != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency: gitops-deploy
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
      - name: Point the manifest at this build
        env:
          FILE: ${{ vars.GITOPS_FILE }}
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA::7}"
          sed -i -E "s#(image: ${IMAGE}:)sha-[0-9a-f]+#\1${tag}#" "$FILE"
          git diff --quiet && { echo "already at ${tag}"; exit 0; }
          git config user.name "marquee-ci"
          git config user.email "marquee-ci@users.noreply.github.com"
          git commit -am "mediaserver: ${tag} (${GITHUB_REPOSITORY}@${GITHUB_SHA::7})"
          for i in 1 2 3; do git push && exit 0; git pull --rebase; done
          exit 1
